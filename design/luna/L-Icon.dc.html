<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Луна · иконка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" aria-hidden="true" style="display: block; flex: none;">
  <path d="{{b}}" fill="{{shade}}"></path>
  <path d="{{a}}" fill="{{color}}"></path>
  <path d="{{cut}}" fill="{{cutColor}}"></path>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"today","options":["today","tasks","habits","goals","pack","settings","plus","back","chevron","close","remind","place","calendar","delete","search","dumbbell","book","drop","nosmoking","rise"]},"size":{"editor":"int","default":24},"tone":{"editor":"enum","default":"text","options":["text","amber","muted","blood","onAmber"]},"on":{"editor":"enum","default":"bg","options":["bg","surface","raised","amber"]},"theme":{"editor":"enum","default":"night","options":["night","dawn"]},"$preview":{"width":24,"height":24}}'>
class Component extends DCLogic {
  renderVals() {
    const PAL = {
      night: { bg: '#0E1220', surface: '#161B2C', raised: '#262D44', text: '#ECE6D6', shade: '#A79F8C', muted: '#9AA0B4', mutedShade: '#6E7488', amber: '#ECE6D6', amberShade: '#A79F8C', blood: '#F0605F', bloodShade: '#B8474A', onAmber: '#0E1220' },
      dawn: { bg: '#F3EEE4', surface: '#FBF8F2', raised: '#E7E0D2', text: '#1A1F2E', shade: '#4A5168', muted: '#5E6375', mutedShade: '#8A8FA0', amber: '#1A1F2E', amberShade: '#4A5168', blood: '#B4232A', bloodShade: '#D9555B', onAmber: '#FBF8F2' }
    };
    // Гранёные иконки: [грань в тени, основная грань, вырез цветом подложки]. Сетка 24.
    const ICONS = {
      today: ['M7 6 L4 13 L11 16 L10 9 Z', 'M15 2 L7 6 L10 9 Z M4 13 L8 20 L16 22 L11 16 Z', ''],
      tasks: ['M15 2 L20 7 H15 Z', 'M4 2 H15 V7 H20 V22 H4 Z', 'M7 13 L9 11 L11 13 L16 8 L18 10 L11 17 Z'],
      habits: ['M2 15 L21 7 L22 9.5 L3 17.5 Z', 'M5 3 H8 L6 21 H3 Z M11 3 H14 L12 21 H9 Z M17 3 H20 L18 21 H15 Z', ''],
      goals: ['M6 7 L19 7 L6 11 Z', 'M4 2 H6 V22 H4 Z M6 3 L19 7 L6 7 Z', ''],
      pack: ['M5 12 L7 14 V22 H5 Z M12 6 L14 8 V22 H12 Z M19 9 L21 11 V22 H19 Z', 'M3 22 V14 L5 12 V22 Z M10 22 V8 L12 6 V22 Z M17 22 V11 L19 9 V22 Z', ''],
      settings: ['M12 2 L21 7 V17 L12 22 Z', 'M12 2 L3 7 V17 L12 22 Z', 'M12 9 L15 12 L12 15 L9 12 Z'],
      plus: ['', 'M10 3 H14 V10 H21 V14 H14 V21 H10 V14 H3 V10 H10 Z', ''],
      back: ['M10 10 H22 V14 H10 Z', 'M2 12 L10 4 V20 Z', ''],
      chevron: ['M12 12 L6 18 L8 20 L16 12 Z', 'M8 4 L16 12 L12 12 L6 6 Z', ''],
      close: ['M18 4 L20 6 L6 20 L4 18 Z', 'M4 6 L6 4 L20 18 L18 20 Z', ''],
      remind: ['M12 2 L18 8 V16 L21 19 H12 Z', 'M12 2 L6 8 V16 L3 19 H12 Z M10 20 H14 L12 23 Z', ''],
      place: ['M12 23 L20 10 L16 3 H12 Z', 'M12 23 L4 10 L8 3 H12 Z', 'M12 7 L14.5 9.5 L12 12 L9.5 9.5 Z'],
      calendar: ['M3 5 H21 V10 H3 Z', 'M3 10 H21 V22 H3 Z M7 2 H9 V8 H7 Z M15 2 H17 V8 H15 Z', ''],
      delete: ['M3 4 H21 V7 H3 Z M9 2 H15 V4 H9 Z', 'M5 7 H19 L17 22 H7 Z', ''],
      search: ['M15 17 L17 15 L22 20 L20 22 Z', 'M10 2 L18 10 L10 18 L2 10 Z', 'M10 6 L14 10 L10 14 L6 10 Z'],
      dumbbell: ['M8 11 H16 V13 H8 Z', 'M2 9 H5 V15 H2 Z M19 9 H22 V15 H19 Z M5 6 H8 V18 H5 Z M16 6 H19 V18 H16 Z', ''],
      book: ['M21 4 L13 6 V21 L21 19 Z', 'M3 4 L11 6 V21 L3 19 Z', ''],
      drop: ['M12 2 L18 13 L15 20 H12 Z', 'M12 2 L6 13 L9 20 H12 Z', ''],
      nosmoking: ['M17 14 H19 V18 H17 Z M20 14 H22 V18 H20 Z M17 4 L20 7 L18 12 L16 10 Z', 'M2 14 H16 V18 H2 Z', ''],
      rise: ['M12 9 L18 16 H12 Z M12 3 H13 V6 H12 Z M19 7 L20 8 L18 10 L17 9 Z', 'M12 9 L6 16 H12 Z M3 18 H21 V20 H3 Z M11 3 H12 V6 H11 Z M4 8 L5 7 L7 9 L6 10 Z', '']
    };
    const t = this.props.theme === 'dawn' ? 'dawn' : 'night';
    const c = PAL[t];
    const tone = this.props.tone ?? 'text';
    const main = { text: c.text, amber: c.amber, muted: c.muted, blood: c.blood, onAmber: c.onAmber }[tone] ?? c.text;
    const shade = { text: c.shade, amber: c.amberShade, muted: c.mutedShade, blood: c.bloodShade, onAmber: c.raised }[tone] ?? c.shade;
    const icon = ICONS[this.props.icon] ?? ICONS.today;
    return {
      size: this.props.size ?? 24,
      b: icon[0] || 'M0 0 Z',
      a: icon[1],
      cut: icon[2] || 'M0 0 Z',
      color: main,
      shade,
      cutColor: c[this.props.on ?? 'bg'] ?? c.bg
    };
  }
}
</script>
</body>
</html>
