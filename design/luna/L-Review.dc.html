<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Луна — Итог дня</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: Onest, system-ui, sans-serif;">
  <div style="padding: 46px 20px 30px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <a href="{{todayHref}}" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -4px;">
        <dc-import name="L-Icon" icon="back" size="20" tone="text" theme="{{theme}}" hint-size="20px,20px"></dc-import>
      </a>
      <a href="#" style="font-size: 14px; font-weight: 500; color: {{c.muted}}; text-decoration: none; min-height: 44px; display: flex; align-items: center;">История</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-variant-numeric: tabular-nums; font-size: 12px; color: {{c.muted}};">вторник · 03.11</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em;">Итог дня</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <span style="display: flex; flex-direction: column; padding: 12px 14px; background: {{c.surface}};"><span style="font-size: 30px; font-weight: 700;">4/5</span><span style="font-size: 12px; color: {{c.muted}};">дел закрыто</span></span>
      <span style="display: flex; flex-direction: column; padding: 12px 14px; background: {{c.surface}};"><span style="font-size: 30px; font-weight: 700;">3/4</span><span style="font-size: 12px; color: {{c.muted}};">привычки</span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-variant-numeric: tabular-nums; font-size: 12px; color: {{c.muted}};">как отработал?</span>
      <div role="radiogroup" aria-label="Оценка дня" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
          <button role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="min-height: 92px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 6px 0;">
            <dc-import name="L-Moon" phase="{{m.phase}}" size="34" tone="{{m.tone}}" ring-tone="{{m.ring}}" theme="{{theme}}" hint-size="34px,34px"></dc-import>
            <span style="font-size: 12px; font-weight: 600;">{{m.label}}</span>
          </button>
        </sc-for>
      </div>
      <span style=" font-weight: 600; font-size: 19px; min-height: 24px;">{{verdict}}</span>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-variant-numeric: tabular-nums; font-size: 12px; color: {{c.muted}};">пару слов (для себя)</span>
      <textarea placeholder="Что зашло, что нет" style="height: 104px; resize: none; border: 1px solid {{c.line}}; background: {{c.surface}}; outline: none; font: inherit; font-size: 15px; padding: 10px 12px; color: {{c.text}};"></textarea>
    </label>

    <a href="{{closedHref}}" style="margin-top: auto; height: 56px; background: {{c.amber}}; color: {{c.onAmber}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 700;">Закрыть день</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"night","options":["night","dawn"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 3 };
  }
  renderVals() {
    const PAL = {
      night: { bg: '#0E1220', surface: '#161B2C', raised: '#262D44', line: '#262D44', text: '#ECE6D6', muted: '#9AA0B4', amber: '#ECE6D6', blood: '#F0605F', onAmber: '#0E1220' },
      dawn: { bg: '#F3EEE4', surface: '#FBF8F2', raised: '#E7E0D2', line: '#DAD2C2', text: '#1A1F2E', muted: '#5E6375', amber: '#1A1F2E', blood: '#B4232A', onAmber: '#FBF8F2' }
    };
    const theme = this.props.theme === 'dawn' ? 'dawn' : 'night';
    const c = PAL[theme];
    const pre = theme === 'dawn' ? 'R-' : 'L-';
    const labels = ['Слил', 'Так себе', 'Норм', 'Хорош', 'Красава'];
    const verdicts = ['Бывает. Завтра отыграемся.', 'Не огонь, но день прожит.', 'Ровно. Так и держи.', 'Достойно. Стая видит.', 'Полнолуние. Красава.'];
    const p = this.state.picked;
    return {
      c, theme,
      verdict: verdicts[p],
      todayHref: pre + 'Today.dc.html',
      closedHref: pre + 'Closed.dc.html',
      moods: labels.map((label, i) => ({
        label,
        phase: i / 4,
        checked: i === p ? 'true' : 'false',
        border: i === p ? c.amber : c.line,
        bg: i === p ? c.raised : 'transparent',
        fg: i === p ? c.text : c.muted,
        tone: i === p ? 'amber' : 'text',
        ring: i === p ? 'amber' : 'muted',
        pick: () => this.setState({ picked: i })
      }))
    };
  }
}
</script>
</body>
</html>
