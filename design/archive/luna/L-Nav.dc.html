<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Луна · таб-бар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Разделы" style="width: 390px; height: 80px; box-sizing: border-box; padding-bottom: 22px; background: {{c.surface}}; border-top: 1px solid {{c.line}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); font-family: Onest, system-ui, sans-serif; font-size: 12px; font-weight: 500;">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
    <a href="{{t.href}}" aria-current="{{t.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.color}};">
      <sc-if value="{{t.active}}" hint-placeholder-val="{{false}}">
        <span aria-hidden="true" style="position: absolute; top: -1px; width: 22px; height: 3px; background: {{c.amber}};"></span>
      </sc-if>
      <dc-import name="L-Icon" icon="{{t.icon}}" size="22" tone="{{t.tone}}" on="surface" theme="{{theme}}" hint-size="22px,22px"></dc-import>
      {{t.label}}
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"today","options":["today","tasks","habits","goals","pack"]},"theme":{"editor":"enum","default":"night","options":["night","dawn"]},"$preview":{"width":390,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const PAL = {
      night: { surface: '#161B2C', line: '#262D44', text: '#ECE6D6', muted: '#9AA0B4', amber: '#ECE6D6' },
      dawn: { surface: '#FBF8F2', line: '#DAD2C2', text: '#1A1F2E', muted: '#5E6375', amber: '#1A1F2E' }
    };
    const theme = this.props.theme === 'dawn' ? 'dawn' : 'night';
    const c = PAL[theme];
    const pre = theme === 'dawn' ? 'R-' : 'L-';
    const active = this.props.active ?? 'today';
    const defs = [
      ['today', 'Сегодня', 'Today'],
      ['tasks', 'Дела', 'Tasks'],
      ['habits', 'Привычки', 'Habits'],
      ['goals', 'Цели', 'Goals'],
      ['pack', 'Стая', 'Pack']
    ];
    return {
      c,
      theme,
      tabs: defs.map(([k, label, file]) => ({
        icon: k,
        label,
        href: pre + file + '.dc.html',
        active: k === active,
        current: k === active ? 'page' : 'false',
        color: k === active ? c.text : c.muted,
        tone: k === active ? 'amber' : 'muted'
      }))
    };
  }
}
</script>
</body>
</html>
