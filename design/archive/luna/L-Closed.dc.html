<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Луна — День закрыт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: Onest, system-ui, sans-serif;">
  <div style="padding: 90px 28px 34px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px;">

    <div style="position: relative; width: 220px; height: 220px; align-self: center;">
      <dc-import name="L-Moon" phase="1" size="220" tone="text" ring-tone="text" theme="{{theme}}" hint-size="220px,220px"></dc-import>
      <div style="position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);">
        <dc-import name="L-Wolf" mood="active" size="128" inverse="{{true}}" theme="{{theme}}" hint-size="128px,128px"></dc-import>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 10px;">
      <h1 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.02em;">День закрыт.</h1>
      <sc-if value="{{quotes}}" hint-placeholder-val="{{true}}">
        <p style="margin: 0; display: flex; flex-direction: column; gap: 2px; font-size: 17px; font-weight: 500; line-height: 1.35;"><span>Сделал — молчи. Не сделал — тоже молчи, но завтра сделай.</span><span style="font-size: 13px; font-weight: 400; color: {{c.muted}};">— волк</span></p>
      </sc-if>
      <span style="font-variant-numeric: tabular-nums; font-size: 12px; color: {{c.muted}};">9 из 9 · серия 15 · +40 очков</span>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <a href="{{todayHref}}" style="height: 56px; background: {{c.amber}}; color: {{c.onAmber}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 700;">Понял</a>
      <span style="text-align: center; font-size: 13px; color: {{c.muted}};">завтра подъём в 6:00 · будильник стоит</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"night","options":["night","dawn"]},"quotes":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const PAL = {
      night: { bg: '#0E1220', text: '#ECE6D6', muted: '#9AA0B4', amber: '#ECE6D6', onAmber: '#0E1220' },
      dawn: { bg: '#F3EEE4', text: '#1A1F2E', muted: '#5E6375', amber: '#1A1F2E', onAmber: '#FBF8F2' }
    };
    const theme = this.props.theme === 'dawn' ? 'dawn' : 'night';
    return { c: PAL[theme], theme, quotes: this.props.quotes ?? true, todayHref: (theme === 'dawn' ? 'R-' : 'L-') + 'Today.dc.html' };
  }
}
</script>
</body>
</html>
