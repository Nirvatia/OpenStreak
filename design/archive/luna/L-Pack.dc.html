<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Луна — Стая</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: Onest, system-ui, sans-serif;">
  <div style="padding: 50px 20px 100px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-variant-numeric: tabular-nums; font-size: 12px; color: {{c.muted}};">с тобой 47 дней</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em;">Стая</h1>
    </div>

    <section aria-label="Звание" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; background: {{c.surface}};">
      <div style="display: flex; align-items: center; gap: 16px;">
        <dc-import name="L-Wolf" mood="active" size="72" on="surface" theme="{{theme}}" hint-size="72px,72px"></dc-import>
        <div style="display: flex; flex-direction: column;">
          <span style="font-variant-numeric: tabular-nums; font-size: 12px; color: {{c.muted}};">Звание</span>
          <span style=" font-weight: 800; font-size: 34px; line-height: 1.05;">Волк</span>
          <span style="font-size: 13px; color: {{c.muted}};">1 240 очков · до Вожака 760</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{ranks}}" as="r" hint-placeholder-count="5">
          <span style="display: flex; flex-direction: column; gap: 6px;">
            <span style="height: 6px; background: {{r.bar}};"></span>
            <span style="font-size: 10px; font-weight: 600; color: {{r.fg}};">{{r.name}}</span>
          </span>
        </sc-for>
      </div>
    </section>

    <section aria-label="Неделя" style="display: flex; flex-direction: column; gap: 10px;">
      <span style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; font-size: 12px; color: {{c.muted}};"><span>Неделя</span><span>58 Отметок</span></span>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 120px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <span style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <span style="font-variant-numeric: tabular-nums; font-size: 12px; color: {{b.labelColor}};">{{b.v}}</span>
            <span style="width: 100%; height: {{b.h}}; background: {{b.bg}};"></span>
            <span style="font-variant-numeric: tabular-nums; font-size: 10px; color: {{b.labelColor}};">{{b.d}}</span>
          </span>
        </sc-for>
      </div>
    </section>

    <section aria-label="Цифры" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{nums}}" as="n" hint-placeholder-count="4">
        <span style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: {{c.surface}};">
          <span style="font-size: 28px; font-weight: 700; line-height: 1.1; color: {{n.color}};">{{n.v}}</span>
          <span style="font-size: 12px; color: {{c.muted}};">{{n.l}}</span>
        </span>
      </sc-for>
    </section>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 80px;">
    <dc-import name="L-Nav" active="pack" theme="{{theme}}" hint-size="390px,80px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"night","options":["night","dawn"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const PAL = {
      night: { bg: '#0E1220', surface: '#161B2C', raised: '#262D44', line: '#262D44', text: '#ECE6D6', muted: '#9AA0B4', amber: '#ECE6D6', blood: '#F0605F' },
      dawn: { bg: '#F3EEE4', surface: '#FBF8F2', raised: '#E7E0D2', line: '#DAD2C2', text: '#1A1F2E', muted: '#5E6375', amber: '#1A1F2E', blood: '#B4232A' }
    };
    const theme = this.props.theme === 'dawn' ? 'dawn' : 'night';
    const c = PAL[theme];
    const data = [['ср', 7], ['чт', 9], ['пт', 6], ['сб', 4], ['вс', 8], ['пн', 11], ['вт', 13]];
    return {
      c, theme,
      ranks: ['Щенок', 'Волчонок', 'Волк', 'Вожак', 'Альфа'].map((name, i) => ({
        name,
        bar: i < 2 ? c.muted : i === 2 ? c.text : c.raised,
        fg: i === 2 ? c.text : c.muted
      })),
      bars: data.map(([d, v], i) => ({
        d, v: String(v),
        h: Math.round((v / 13) * 78) + 'px',
        bg: i === data.length - 1 ? c.amber : c.raised,
        labelColor: i === data.length - 1 ? c.text : c.muted
      })),
      nums: [
        { v: '23', l: 'дела закрыто', color: c.text },
        { v: '6', l: 'чистых дней подряд', color: c.text },
        { v: '41', l: 'лучшая серия', color: c.text },
        { v: '1', l: 'слив за неделю', color: c.blood }
      ]
    };
  }
}
</script>
</body>
</html>
