<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Штамп — Новое дело</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Golos+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#151515}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
input::placeholder,textarea::placeholder{color:#5A5650}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E4E1DA; color: #151515; font-family: 'Golos Text', system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 52px 20px; box-sizing: border-box;">
    <div style="font-family: Oswald, sans-serif; font-weight: 700; font-size: 44px; line-height: 0.95;">ДЕЛА<br>НА СЕГОДНЯ</div>
  </div>
  <a href="B-Today.dc.html" aria-label="Закрыть" style="position: absolute; inset: 0; background: rgba(21,21,21,0.62);"></a>

  <section aria-label="Новое дело" style="position: absolute; left: 0; right: 0; bottom: 0; height: 684px; background: #E4E1DA; border-top: 3px solid #151515; padding: 12px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
    <div style="align-self: center; width: 44px; height: 4px; background: #151515;"></div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1 style="margin: 0; font-family: Oswald, sans-serif; font-weight: 700; font-size: 30px; line-height: 1;">НОВОЕ ДЕЛО</h1>
      <a href="B-Today.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px;">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19" stroke="#151515" stroke-width="3" stroke-linecap="square" fill="none"></path></svg>
      </a>
    </div>

    <label style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #5A5650;">ЧТО СДЕЛАТЬ</span>
      <input value="Записаться в зал" style="border: none; border-bottom: 3px solid #151515; background: transparent; outline: none; font: inherit; font-size: 22px; font-weight: 600; padding: 6px 0; color: #151515;">
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #5A5650;">КОГДА</span>
      <div role="radiogroup" aria-label="Когда" style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button role="radio" aria-checked="true" style="height: 40px; padding: 0 14px; border: 2.5px solid #151515; background: #151515; color: #E4E1DA; font-size: 14px; font-weight: 700;">Сегодня</button>
        <button role="radio" aria-checked="false" style="height: 40px; padding: 0 14px; border: 2.5px solid #151515; background: transparent; color: #151515; font-size: 14px; font-weight: 700;">Завтра</button>
        <button role="radio" aria-checked="false" style="height: 40px; padding: 0 14px; border: 2.5px solid #151515; background: transparent; color: #151515; font-size: 14px; font-weight: 700;">Без даты</button>
        <button role="radio" aria-checked="false" style="height: 40px; padding: 0 12px; border: 2.5px dashed #151515; background: transparent; color: #151515; font-size: 14px; font-weight: 700;">Дата…</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #5A5650;">ВАЖНОСТЬ</span>
      <div role="radiogroup" aria-label="Важность" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 2.5px solid #151515;">
        <button role="radio" aria-checked="false" style="height: 44px; border: none; background: transparent; color: #151515; font-size: 13px; font-weight: 700;">—</button>
        <button role="radio" aria-checked="false" style="height: 44px; border: none; border-left: 2.5px solid #151515; background: transparent; color: #151515; font-family: Oswald, sans-serif; font-size: 18px; font-weight: 700;">!</button>
        <button role="radio" aria-checked="true" style="height: 44px; border: none; border-left: 2.5px solid #151515; background: #151515; color: #E4E1DA; font-family: Oswald, sans-serif; font-size: 18px; font-weight: 700;">!!</button>
        <button role="radio" aria-checked="false" style="height: 44px; border: none; border-left: 2.5px solid #151515; background: transparent; color: #A50D26; font-family: Oswald, sans-serif; font-size: 18px; font-weight: 700;">!!!</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #5A5650;">НАПОМНИТЬ</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button style="height: 52px; border: 2.5px dashed #151515; background: transparent; color: #151515; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; font-weight: 600;">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17 V10 L12 4 L18 10 V17 Z M4 17 H20 M10 21 H14" stroke="#151515" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" fill="none"></path></svg>По времени</button>
        <button style="height: 52px; border: 2.5px solid #151515; background: #151515; color: #E4E1DA; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; font-weight: 600; text-align: left;">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22 L5 11 V7 L9 3 H15 L19 7 V11 Z M10 8 H14 V12 H10 Z" stroke="#E4E1DA" stroke-width="2.5" stroke-linejoin="miter" fill="none"></path></svg>
          <span style="display: flex; flex-direction: column; line-height: 1.15;"><span>У зала</span><span style="font-size: 11px; color: #BDBAB3;">при входе · 150 м</span></span></button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #5A5650;">СФЕРА</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button aria-pressed="true" style="height: 36px; padding: 0 12px; border: 2px solid #151515; background: #151515; color: #E4E1DA; font-size: 13px; font-weight: 700; letter-spacing: 0.06em;">СПОРТ</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 12px; border: 2px solid #151515; background: transparent; color: #151515; font-size: 13px; font-weight: 700; letter-spacing: 0.06em;">РАБОТА</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 12px; border: 2px solid #151515; background: transparent; color: #151515; font-size: 13px; font-weight: 700; letter-spacing: 0.06em;">ЛИЧНОЕ</button>
      </div>
    </div>

    <a href="B-Today.dc.html" style="margin-top: auto; height: 60px; background: #151515; color: #E4E1DA; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: Oswald, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.14em; box-shadow: 5px 5px 0 {{ink}};">ЗАПИСАТЬ</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink":{"editor":"color","default":"#C8102E","options":["#C8102E","#1F3FA8","#151515"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { ink: this.props.ink ?? '#C8102E' };
  }
}
</script>
</body>
</html>
