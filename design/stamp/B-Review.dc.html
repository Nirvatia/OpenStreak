<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Штамп — Итог дня</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Golos+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#151515}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
textarea::placeholder{color:#5A5650}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E4E1DA; color: #151515; font-family: 'Golos Text', system-ui, sans-serif;">
  <div style="padding: 52px 20px 28px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <a href="B-Today.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 H4 M10 6 L4 12 L10 18" stroke="#151515" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" fill="none"></path></svg>
      </a>
      <a href="#" style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-decoration: none;">ИСТОРИЯ</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #5A5650;">ВТОРНИК · 04.11</div>
      <h1 style="margin: 0; font-family: Oswald, sans-serif; font-weight: 700; font-size: 44px; line-height: 0.95;">ИТОГ ДНЯ</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 2.5px solid #151515; border-bottom: 2.5px solid #151515;">
      <div style="padding: 12px 0; display: flex; flex-direction: column;"><span style="font-family: Oswald, sans-serif; font-weight: 700; font-size: 34px; line-height: 1;">4/5</span><span style="font-size: 12px; color: #5A5650;">дел закрыто</span></div>
      <div style="padding: 12px 0 12px 14px; border-left: 1px dashed #151515; display: flex; flex-direction: column;"><span style="font-family: Oswald, sans-serif; font-weight: 700; font-size: 34px; line-height: 1;">3/4</span><span style="font-size: 12px; color: #5A5650;">привычки</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #5A5650;">КАК ОТРАБОТАЛ?</span>
      <div role="radiogroup" aria-label="Оценка дня" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
          <button role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="height: 86px; border: {{m.border}}; background: transparent; color: {{m.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0; transform: {{m.rot}};">
            <span style="font-family: Oswald, sans-serif; font-weight: 700; font-size: 26px; line-height: 1;">{{m.n}}</span>
            <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em;">{{m.label}}</span>
          </button>
        </sc-for>
      </div>
      <div style="font-size: 14px; font-weight: 600; min-height: 20px;">{{verdict}}</div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #5A5650;">ПАРУ СЛОВ (ДЛЯ СЕБЯ)</span>
      <textarea placeholder="Что зашло, что нет" style="height: 110px; resize: none; border: 2.5px solid #151515; background: #F1EFE9; outline: none; font: inherit; font-size: 15px; padding: 10px; color: #151515;"></textarea>
    </label>

    <div style="position: relative; margin-top: auto;">
      <a href="B-Today.dc.html" style="height: 60px; background: #151515; color: #E4E1DA; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: Oswald, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.14em; box-shadow: 5px 5px 0 {{ink}};">ЗАКРЫТЬ ДЕНЬ</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink":{"editor":"color","default":"#C8102E","options":["#C8102E","#1F3FA8","#151515"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 4 }; }
  renderVals() {
    const ink = this.props.ink ?? '#C8102E';
    const labels = ['СЛИЛ', 'ТАК СЕБЕ', 'НОРМ', 'ХОРОШ', 'КРАСАВА'];
    const verdicts = ['Бывает. Завтра отыграемся.', 'Не огонь, но день прожит.', 'Ровно. Так и держи.', 'Достойно. Стая видит.', 'Красава. День закрыт на все сто.'];
    const p = this.state.picked;
    return {
      ink,
      verdict: verdicts[p],
      moods: labels.map((label, i) => ({
        n: String(i + 1), label,
        checked: i === p ? 'true' : 'false',
        border: i === p ? '3px solid ' + ink : '2.5px solid #151515',
        color: i === p ? ink : '#151515',
        rot: i === p ? 'rotate(-6deg)' : 'none',
        pick: () => this.setState({ picked: i })
      }))
    };
  }
}
</script>
</body>
</html>
