<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сегодня — мульт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;family=Unbounded:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: Rubik, system-ui, sans-serif;">

<sc-if value="{{night}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none;">
<span style="position: absolute; left: 196px; top: 30px; width: 5px; height: 5px; border-radius: 50%; background: {{c.star}};"></span>
<span style="position: absolute; left: 252px; top: 64px; width: 3px; height: 3px; border-radius: 50%; background: {{c.star}};"></span>
<span style="position: absolute; left: 300px; top: 22px; width: 4px; height: 4px; border-radius: 50%; background: {{c.star}};"></span>
<span style="position: absolute; left: 160px; top: 76px; width: 3px; height: 3px; border-radius: 50%; background: {{c.star}};"></span>
</div>
</sc-if>

<div style="position: relative; padding: 46px 20px 120px; display: flex; flex-direction: column; gap: 18px;">

<div style="display: flex; justify-content: space-between; align-items: flex-start;">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px;">
<span style="transform: rotate(-2deg); display: inline-block; padding: 6px 12px; background: {{c.tag}}; color: {{c.text}}; border: 2.5px solid {{c.line}}; border-radius: 12px; box-shadow: 3px 3px 0 {{c.shadow}}; font-family: Unbounded, Rubik, sans-serif; font-size: 15px; font-weight: 700;">Среда, 4 ноября</span>
<span style="font-size: 13px; color: {{c.muted}}; font-variant-numeric: tabular-nums;">день 47 · серия 14</span>
</div>
<a href="#" aria-label="Настройки" style="width: 46px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{c.surface}}; color: {{c.text}}; border: 2.5px solid {{c.line}}; border-radius: 50%; box-shadow: 3px 3px 0 {{c.shadow}};">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2.2"></circle><circle cx="9" cy="17" r="2.2"></circle></svg>
</a>
</div>

<div style="position: relative; display: flex; align-items: center; gap: 18px; padding: 18px; background: {{c.surface}}; border: 2.5px solid {{c.line}}; border-radius: 24px; box-shadow: 5px 5px 0 {{c.shadow}};" aria-label="{{progressLabel}}">
<dc-import name="M-Moon" phase="{{dayPhase}}" state="normal" size="96" theme="{{theme}}" hint-size="96px,96px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-family: Unbounded, Rubik, sans-serif; font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">{{doneN}}<span style="font-weight: 600; color: {{c.muted}};"> / {{total}}</span></span>
<span style="font-size: 14px; color: {{c.muted}};">{{phaseText}}</span>
</div>
<span style="position: absolute; top: -14px; right: 14px; transform: rotate(6deg); padding: 4px 10px; background: {{c.sun}}; color: {{c.onSun}}; border: 2.5px solid {{c.line}}; border-radius: 10px; font-family: Unbounded, Rubik, sans-serif; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">+{{points}} очков</span>
</div>

<sc-if value="{{quotes}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: flex-end; gap: 6px;">
<dc-import name="M-Wolf" mood="{{wolfMood}}" size="76" theme="{{theme}}" hint-size="76px,76px"></dc-import>
<p style="flex: 1; margin: 0 0 10px; padding: 12px 14px; background: {{c.tag}}; border: 2.5px solid {{c.line}}; border-radius: 18px 18px 18px 4px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 15px; font-weight: 500; line-height: 1.35;">Волк не ждёт понедельника. Волк и есть понедельник.</span>
<span style="font-size: 12px; color: {{c.muted}};">— волк</span>
</p>
</div>
</sc-if>

<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border: 2.5px dashed {{c.line}}; border-radius: 16px; text-decoration: none; color: {{c.text}}; font-size: 16px; font-weight: 500;">
<span aria-hidden="true" style="width: 30px; height: 30px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{c.sun}}; color: {{c.onSun}}; border: 2.5px solid {{c.line}}; border-radius: 50%;"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 2v10M2 7h10"></path></svg></span>
Запиши дело или привычку
</a>

<section aria-label="Осталось" style="display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; align-self: flex-start; transform: rotate(-3deg); padding: 5px 12px; background: {{c.sun}}; color: {{c.onSun}}; border: 2.5px solid {{c.line}}; border-radius: 10px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;">Осталось · {{leftN}}</h2>
<sc-if value="{{hasLeft}}" hint-placeholder-val="{{true}}">
<div style="padding: 2px 14px; background: {{c.surface}}; border: 2.5px solid {{c.line}}; border-radius: 20px; box-shadow: 5px 5px 0 {{c.shadow}};">
<sc-for list="{{left}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 8px; min-height: 60px; border-bottom: {{r.divider}};">
<button onClick="{{r.tap}}" aria-label="{{r.aria}}" style="width: 44px; height: 44px; margin-left: -8px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center;">
<dc-import name="M-Moon" phase="{{r.phase}}" state="{{r.state}}" size="28" theme="{{theme}}" hint-size="28px,28px"></dc-import>
</button>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
<span style="font-size: 16px; font-weight: 500;">{{r.title}}</span>
<sc-if value="{{r.sub}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: {{c.muted}};">{{r.sub}}</span></sc-if>
</span>
<sc-if value="{{r.debt}}" hint-placeholder-val="{{false}}"><span style="padding: 3px 10px; background: {{c.red}}; color: {{c.onRed}}; border-radius: 999px; font-size: 13px; font-weight: 600;">долг</span></sc-if>
<sc-if value="{{r.meta}}" hint-placeholder-val="{{false}}"><span style="font-family: Unbounded, Rubik, sans-serif; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">{{r.meta}}</span></sc-if>
<sc-if value="{{r.prio}}" hint-placeholder-val="{{false}}">
<span aria-label="Важность 2 из 3" style="display: flex; gap: 5px; padding-right: 4px;">
<span style="width: 9px; height: 9px; box-sizing: border-box; background: {{c.sun}}; border: 2px solid {{c.line}}; transform: rotate(45deg);"></span>
<span style="width: 9px; height: 9px; box-sizing: border-box; background: {{c.sun}}; border: 2px solid {{c.line}}; transform: rotate(45deg);"></span>
</span>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>
</section>

<section aria-label="Сделано" style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; align-self: flex-start; transform: rotate(2deg); padding: 5px 12px; background: {{c.teal}}; color: {{c.onTeal}}; border: 2.5px solid {{c.line}}; border-radius: 10px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;">Сделано · {{doneN}}</h2>
<div style="display: flex; flex-direction: column;">
<sc-for list="{{log}}" as="l" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 36px;">
<span style="font-size: 13px; color: {{c.muted}}; font-variant-numeric: tabular-nums;">{{l.time}}</span>
<span style="font-size: 15px; color: {{c.muted}}; text-decoration: line-through;">{{l.title}}</span>
<span style="padding: 2px 10px; border: 2px solid {{l.color}}; color: {{l.color}}; border-radius: 999px; font-size: 13px; font-weight: 600;">{{l.mark}}</span>
</div>
</sc-for>
</div>
</section>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px;">
<dc-import name="M-Nav" active="today" theme="{{theme}}" hint-size="390px,96px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"day","options":["day","night"]},"quotes":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      left: [
        { id: 'debt', title: 'Закрыть долг Сане', sub: 'со вчера', phase: 0, debt: true },
        { id: 'push', title: 'Отжимания', sub: 'ещё 40 · серия 14', meta: '60/100', phase: 0.6 },
        { id: 'gym', title: 'Записаться в зал', sub: 'напомню в 19:00', phase: 0, prio: true },
        { id: 'read', title: 'Читать 20 минут', sub: '', meta: '9 дн', phase: 0 }
      ],
      log: [
        { time: '13:20', title: 'Вода 2 литра', mark: 'зачёт', slip: false },
        { time: '07:05', title: 'Подъём в 6:00', mark: 'слив', slip: true },
        { time: '06:40', title: 'Купить протеин', mark: 'зачёт', slip: false },
        { time: '', title: 'Не курить', mark: 'держусь', slip: false }
      ]
    };
  }
  renderVals() {
    const PAL = {
      day: { bg: '#F3E9D2', surface: '#FFF8E8', text: '#1E2233', line: '#1E2233', shadow: '#1E2233', muted: '#5A5E6E', sun: '#F5B82E', onSun: '#1E2233', teal: '#17705F', onTeal: '#FFF8E8', red: '#B8322A', onRed: '#FFF8E8', tag: '#F7D9A8', divider: '#E9D9B6', star: '#F3E9D2' },
      night: { bg: '#1D2740', surface: '#2A3758', text: '#F6EBD3', line: '#0B1020', shadow: '#0B1020', muted: '#AEB6CC', sun: '#FFC94A', onSun: '#0B1020', teal: '#4CC2AE', onTeal: '#0B1020', red: '#FF8273', onRed: '#0B1020', tag: '#3A4A73', divider: '#3A4A73', star: '#F6EBD3' }
    };
    const theme = this.props.theme === 'night' ? 'night' : 'day';
    const c = PAL[theme];
    const total = 8;
    const doneN = this.state.log.filter((l) => !l.slip).length;
    const leftList = this.state.left;
    const left = leftList.map((r, i) => ({
      ...r,
      sub: r.sub || '',
      meta: r.meta || '',
      prio: !!r.prio,
      debt: !!r.debt,
      state: r.debt ? 'debt' : 'normal',
      divider: i === leftList.length - 1 ? 'none' : '2px dashed ' + c.divider,
      aria: 'Отметить: ' + r.title,
      tap: () => this.setState({
        left: this.state.left.filter((x) => x.id !== r.id),
        log: [{ time: 'сейчас', title: r.title, mark: 'зачёт', slip: false }, ...this.state.log]
      })
    }));
    const rest = total - doneN;
    return {
      c, theme,
      night: theme === 'night',
      quotes: this.props.quotes ?? true,
      left, leftN: left.length, hasLeft: left.length > 0,
      log: this.state.log.slice(0, 5).map((l) => ({ ...l, color: l.slip ? c.red : c.teal })),
      doneN, total,
      dayPhase: doneN / total,
      points: 30 + (doneN - 3) * 10,
      wolfMood: rest > 0 ? 'smirk' : 'proud',
      progressLabel: 'Сделано ' + doneN + ' из ' + total,
      phaseText: rest > 0 ? 'до полнолуния — ' + rest : 'полнолуние! красава'
    };
  }
}
</script>
</body>
</html>
