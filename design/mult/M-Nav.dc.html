<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Таб-бар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 100%; min-width: 360px; height: 96px; box-sizing: border-box; padding: 6px 14px 18px; font-family: Rubik, system-ui, sans-serif;">
<nav aria-label="Разделы" style="height: 68px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 5px; background: {{c.surface}}; border: 2.5px solid {{c.line}}; border-radius: 22px; box-shadow: 4px 4px 0 {{c.shadow}};">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<a href="{{it.href}}" aria-current="{{it.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 15px; text-decoration: none; background: {{it.bg}}; border: {{it.border}}; color: {{it.fg}};">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
<sc-for list="{{it.paths}}" as="p" hint-placeholder-count="2">
<path d="{{p.d}}" fill="{{p.fill}}"></path>
</sc-for>
</svg>
<span style="font-size: 11px; font-weight: {{it.weight}};">{{it.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"today","options":["today","tasks","habits","goals","pack"]},"theme":{"editor":"enum","default":"day","options":["day","night"]},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const PAL = {
      day: { surface: '#FFF8E8', line: '#1E2233', shadow: '#1E2233', text: '#1E2233', muted: '#5A5E6E', sun: '#F5B82E', onSun: '#1E2233' },
      night: { surface: '#2A3758', line: '#0B1020', shadow: '#0B1020', text: '#F6EBD3', muted: '#AEB6CC', sun: '#FFC94A', onSun: '#0B1020' }
    };
    const night = this.props.theme === 'night';
    const c = PAL[night ? 'night' : 'day'];
    const active = this.props.active ?? 'today';
    const dot = (x, y, r) => ({ d: 'M' + (x - r) + ' ' + y + 'a' + r + ' ' + r + ' 0 1 0 ' + 2 * r + ' 0a' + r + ' ' + r + ' 0 1 0 ' + -2 * r + ' 0', fill: 'currentColor' });
    const line = (d) => ({ d, fill: 'none' });
    const icons = {
      today: [line('M15 3a9 9 0 1 0 6 13.5A7.5 7.5 0 0 1 15 3z')],
      tasks: [line('M5 4h14v16H5z'), line('M8.5 12l2.5 2.5 5-5')],
      habits: [line('M12 3c1 4 5.5 5.5 5.5 10.5a5.5 5.5 0 0 1-11 0c0-3 2-4.5 2.5-6.5 1.2 1 2 2.5 2 4 1.2-2.2 1.5-5 1-8z')],
      goals: [line('M6 21V4'), line('M6 4h12l-2.5 4 2.5 4H6')],
      pack: [dot(6.5, 10, 1.8), dot(10, 6.5, 1.8), dot(14, 6.5, 1.8), dot(17.5, 10, 1.8), line('M8 17c0-3 2-5 4-5s4 2 4 5c0 2-2 3-4 3s-4-1-4-3z')]
    };
    const pre = night ? 'Night' : '';
    const hrefs = { today: 'M-Today' + (night ? '-Night' : '') + '.dc.html', habits: 'M-Habits' + (night ? '-Night' : '') + '.dc.html' };
    const labels = [['today', 'Сегодня'], ['tasks', 'Дела'], ['habits', 'Привычки'], ['goals', 'Цели'], ['pack', 'Стая']];
    return {
      c,
      items: labels.map(([k, label]) => {
        const on = k === active;
        return {
          label, paths: icons[k],
          href: hrefs[k] ?? '#',
          current: on ? 'page' : 'false',
          bg: on ? c.sun : 'transparent',
          border: on ? '2px solid ' + c.line : '2px solid transparent',
          fg: on ? c.onSun : c.muted,
          weight: on ? 700 : 500
        };
      }),
      pre
    };
  }
}
</script>
</body>
</html>
