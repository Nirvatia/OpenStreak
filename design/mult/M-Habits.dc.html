<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Привычки — мульт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;family=Unbounded:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: Rubik, system-ui, sans-serif;">
<div style="padding: 46px 20px 120px; display: flex; flex-direction: column; gap: 18px;">

<div style="display: flex; justify-content: space-between; align-items: flex-end;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: {{c.muted}}; font-variant-numeric: tabular-nums;">5 в деле · 1 вредная</span>
<h1 style="margin: 0; font-family: Unbounded, Rubik, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em;">Привычки</h1>
</div>
<a href="#" aria-label="Новая привычка" style="width: 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{c.sun}}; color: {{c.onSun}}; border: 2.5px solid {{c.line}}; border-radius: 50%; box-shadow: 3px 3px 0 {{c.shadow}};">
<svg width="18" height="18" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 2v10M2 7h10"></path></svg>
</a>
</div>

<div role="radiogroup" aria-label="Какие привычки" style="display: flex; gap: 4px; padding: 4px; background: {{c.surface}}; border: 2.5px solid {{c.line}}; border-radius: 999px;">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button role="radio" aria-checked="{{f.checked}}" onClick="{{f.tap}}" style="flex: 1; height: 40px; border: {{f.border}}; border-radius: 999px; background: {{f.bg}}; color: {{f.fg}}; font-size: 15px; font-weight: {{f.weight}};">{{f.label}}</button>
</sc-for>
</div>

<sc-for list="{{habits}}" as="h" hint-placeholder-count="4">
<a href="#" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; background: {{c.surface}}; border: 2.5px solid {{c.line}}; border-radius: 22px; box-shadow: 5px 5px 0 {{c.shadow}}; text-decoration: none; color: {{c.text}};">
<div style="display: flex; align-items: center; gap: 12px;">
<span aria-hidden="true" style="width: 46px; height: 46px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{h.iconBg}}; color: {{h.iconFg}}; border: 2.5px solid {{c.line}}; border-radius: 14px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{h.icon}}"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
<span style="font-size: 17px; font-weight: 600;">{{h.name}}</span>
<span style="font-size: 13px; color: {{c.muted}};">{{h.meta}}</span>
</span>
<span style="width: 60px; height: 60px; flex: none; box-sizing: border-box; transform: rotate({{h.tilt}}); display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{h.badgeBg}}; color: {{h.badgeFg}}; border: 2.5px solid {{c.line}}; border-radius: 50%;">
<span style="font-family: Unbounded, Rubik, sans-serif; font-size: 19px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;">{{h.streak}}</span>
<span style="font-size: 10px; font-weight: 600;">{{h.streakLabel}}</span>
</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;">
<sc-for list="{{h.week}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
<dc-import name="M-Moon" phase="{{d.phase}}" state="{{d.state}}" size="28" theme="{{theme}}" hint-size="28px,28px"></dc-import>
<span style="font-size: 11px; font-weight: {{d.weight}}; color: {{d.color}};">{{d.label}}</span>
</div>
</sc-for>
</div>
<sc-if value="{{h.note}}" hint-placeholder-val="{{false}}">
<span style="align-self: flex-start; transform: rotate(-1.5deg); padding: 7px 12px; background: {{c.tag}}; border: 2px solid {{c.red}}; border-radius: 12px; font-size: 14px; font-weight: 500;">{{h.note}}</span>
</sc-if>
</a>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px;">
<dc-import name="M-Nav" active="habits" theme="{{theme}}" hint-size="390px,96px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"day","options":["day","night"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const PAL = {
      day: { bg: '#F3E9D2', surface: '#FFF8E8', text: '#1E2233', line: '#1E2233', shadow: '#1E2233', muted: '#5A5E6E', sun: '#F5B82E', onSun: '#1E2233', teal: '#17705F', onTeal: '#FFF8E8', red: '#B8322A', tag: '#F7D9A8', sky: '#9CCFDB' },
      night: { bg: '#1D2740', surface: '#2A3758', text: '#F6EBD3', line: '#0B1020', shadow: '#0B1020', muted: '#AEB6CC', sun: '#FFC94A', onSun: '#0B1020', teal: '#4CC2AE', onTeal: '#0B1020', red: '#FF8273', tag: '#3A4A73', sky: '#8FC3D9' }
    };
    const theme = this.props.theme === 'night' ? 'night' : 'day';
    const c = PAL[theme];
    const labels = ['ср', 'чт', 'пт', 'сб', 'вс', 'пн', 'вт'];
    const week = (codes, part) => codes.split('').map((k, i) => {
      const today = i === 6;
      const base = { label: labels[i], weight: today ? 700 : 400, color: today ? c.text : c.muted };
      if (k === 'd' || k === 'c') return { ...base, phase: 1, state: 'normal' };
      if (k === 'p') return { ...base, phase: part, state: 'normal' };
      if (k === 'x') return { ...base, phase: 1, state: 'slip' };
      if (k === 'r') return { ...base, phase: 0, state: 'rest' };
      return { ...base, phase: 0, state: 'normal' };
    });
    const icons = {
      dumbbell: 'M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12',
      book: 'M4 5c3-1 6-1 8 1v13c-2-2-5-2-8-1zM20 5c-3-1-6-1-8 1v13c2-2 5-2 8-1z',
      nosmoke: 'M3 13h12v3.5H3zM18 13v3.5M4 4l16 16',
      rise: 'M3 18h18M7 18a5 5 0 0 1 10 0M12 5v3M5 10l2 2M19 10l-2 2'
    };
    const all = [
      { kind: 'good', name: 'Отжимания', icon: icons.dumbbell, iconBg: c.sun, iconFg: c.onSun, meta: '100 в день · сегодня 60', streak: '14', streakLabel: 'дней', badgeBg: c.sun, badgeFg: c.onSun, tilt: '8deg', week: week('ddddddp', 0.6), note: '' },
      { kind: 'good', name: 'Читать 20 минут', icon: icons.book, iconBg: c.sky, iconFg: c.onSun, meta: 'каждый день · выходные — отдых', streak: '9', streakLabel: 'дней', badgeBg: c.sun, badgeFg: c.onSun, tilt: '-6deg', week: week('ddrrddt', 0), note: '' },
      { kind: 'bad', name: 'Не курить', icon: icons.nosmoke, iconBg: c.teal, iconFg: c.onTeal, meta: 'вредная · с 12 октября', streak: '23', streakLabel: 'чистых', badgeBg: c.teal, badgeFg: c.onTeal, tilt: '5deg', week: week('ccccccc', 0), note: '' },
      { kind: 'good', name: 'Подъём в 6:00', icon: icons.rise, iconBg: c.sun, iconFg: c.onSun, meta: 'пн–пт', streak: '0', streakLabel: 'с нуля', badgeBg: c.tag, badgeFg: c.text, tilt: '-4deg', week: week('ddrrdxt', 0), note: 'Слил вчера. Встал — и дальше.' }
    ];
    const f = this.state.filter;
    const filters = [['all', 'Все'], ['good', 'Полезные'], ['bad', 'Вредные']].map(([k, label]) => {
      const on = f === k;
      return {
        label, checked: on ? 'true' : 'false',
        bg: on ? c.sun : 'transparent', fg: on ? c.onSun : c.text,
        border: on ? '2px solid ' + c.line : '2px solid transparent',
        weight: on ? 700 : 500,
        tap: () => this.setState({ filter: k })
      };
    });
    return { c, theme, filters, habits: all.filter((h) => f === 'all' || h.kind === f) };
  }
}
</script>
</body>
</html>
