<x-dc>
<helmet>
<style>

</helmet>
<div style="width: {{px}}; height: {{px}}; display: flex; align-items: center; justify-content: center; color: {{color}};">

<path d="{{d}}"></path>
<sc-if value="{{dots}}" hint-placeholder-val="{{false}}"><path d="{{dots}}" fill="currentColor"></path></sc-if>
</svg>
</div>

</script>
