<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>День закрыт — мульт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;family=Unbounded:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: Rubik, system-ui, sans-serif;">

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none;">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="9">
<span style="position: absolute; left: {{s.x}}; top: {{s.y}}; width: {{s.r}}; height: {{s.r}}; border-radius: 50%; background: {{c.star}};"></span>
</sc-for>
</div>

<div aria-hidden="true" style="position: relative; height: 360px; display: flex; flex-direction: column; align-items: center; padding-top: 58px; box-sizing: border-box;">
<dc-import name="M-Moon" phase="1" state="normal" size="210" theme="{{theme}}" hint-size="210px,210px"></dc-import>
<div style="margin-top: -96px; position: relative;">
<dc-import name="M-Wolf" mood="proud" size="150" theme="{{theme}}" hint-size="150px,150px"></dc-import>
</div>
<svg width="390" height="70" viewBox="0 0 390 70" style="position: absolute; left: 0; bottom: -18px;">
<path d="M-4 40 C60 10 120 14 180 30 C250 48 320 18 394 26 L394 74 L-4 74 Z" fill="{{c.hill}}" stroke="{{c.line}}" stroke-width="2.5"></path>
</svg>
</div>

<div style="position: relative; padding: 34px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;">
<h1 style="margin: 0; font-family: Unbounded, Rubik, sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05;">День закрыт.</h1>

<sc-if value="{{quotes}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; padding: 12px 16px; background: {{c.tag}}; border: 2.5px solid {{c.line}}; border-radius: 18px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 16px; font-weight: 500; line-height: 1.35;">Сделал — молчи. Не сделал — тоже молчи, но завтра сделай.</span>
<span style="font-size: 12px; color: {{c.muted}};">— волк</span>
</p>
</sc-if>

<div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
<span style="transform: rotate(-4deg); padding: 6px 12px; background: {{c.sun}}; color: {{c.onSun}}; border: 2.5px solid {{c.line}}; border-radius: 12px; box-shadow: 3px 3px 0 {{c.shadow}}; font-family: Unbounded, Rubik, sans-serif; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">8 из 8</span>
<span style="transform: rotate(3deg); padding: 6px 12px; background: {{c.teal}}; color: {{c.onTeal}}; border: 2.5px solid {{c.line}}; border-radius: 12px; box-shadow: 3px 3px 0 {{c.shadow}}; font-family: Unbounded, Rubik, sans-serif; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">серия 15</span>
<span style="transform: rotate(-2deg); padding: 6px 12px; background: {{c.surface}}; color: {{c.text}}; border: 2.5px solid {{c.line}}; border-radius: 12px; box-shadow: 3px 3px 0 {{c.shadow}}; font-family: Unbounded, Rubik, sans-serif; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">+40 очков</span>
</div>
</div>

<div style="position: absolute; left: 24px; right: 24px; bottom: 38px; display: flex; flex-direction: column; gap: 12px; align-items: stretch;">
<a href="{{todayHref}}" style="height: 58px; display: flex; align-items: center; justify-content: center; background: {{c.sun}}; color: {{c.onSun}}; border: 2.5px solid {{c.line}}; border-radius: 18px; box-shadow: 5px 5px 0 {{c.shadow}}; text-decoration: none; font-family: Unbounded, Rubik, sans-serif; font-size: 18px; font-weight: 700;">Понял</a>
<span style="text-align: center; font-size: 13px; color: {{c.muted}};">завтра подъём в 6:00 · будильник стоит</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"night","options":["day","night"]},"quotes":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const PAL = {
      day: { bg: '#9CCFDB', surface: '#FFF8E8', text: '#1E2233', line: '#1E2233', shadow: '#1E2233', muted: '#3F4354', sun: '#F5B82E', onSun: '#1E2233', teal: '#17705F', onTeal: '#FFF8E8', tag: '#FFF8E8', hill: '#F7D9A8', star: '#FFF8E8' },
      night: { bg: '#1D2740', surface: '#2A3758', text: '#F6EBD3', line: '#0B1020', shadow: '#0B1020', muted: '#AEB6CC', sun: '#FFC94A', onSun: '#0B1020', teal: '#4CC2AE', onTeal: '#0B1020', tag: '#3A4A73', hill: '#2A3758', star: '#F6EBD3' }
    };
    const theme = this.props.theme === 'day' ? 'day' : 'night';
    const night = theme === 'night';
    const pts = [[34, 60, 4], [88, 128, 3], [320, 70, 5], [350, 150, 3], [60, 230, 3], [300, 250, 4], [180, 34, 3], [250, 110, 3], [24, 320, 3]];
    return {
      c: PAL[theme], theme,
      quotes: this.props.quotes ?? true,
      stars: night ? pts.map(([x, y, r]) => ({ x: x + 'px', y: y + 'px', r: r + 'px' })) : [],
      todayHref: night ? 'M-Today-Night.dc.html' : 'M-Today.dc.html'
    };
  }
}
</script>
</body>
</html>
