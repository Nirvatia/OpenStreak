<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Волк</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: flex; align-items: center; justify-content: center;">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 120 120" role="img" aria-label="{{label}}">
<g stroke="{{c.line}}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M22 62 L6 70 L20 74 L10 82 L28 80 Z" fill="{{c.fur}}"></path>
<path d="M98 62 L114 70 L100 74 L110 82 L92 80 Z" fill="{{c.fur}}"></path>
<path d="M24 46 L28 6 L54 30 Z" fill="{{c.fur}}"></path>
<path d="M96 46 L92 6 L66 30 Z" fill="{{c.fur}}"></path>
<path d="M31 36 L32 18 L45 31 Z" fill="{{c.ear}}" stroke-width="2"></path>
<path d="M89 36 L88 18 L75 31 Z" fill="{{c.ear}}" stroke-width="2"></path>
<path d="M18 54 C18 32 38 22 60 22 C82 22 102 32 102 54 C102 70 96 80 86 88 L60 108 L34 88 C24 80 18 70 18 54 Z" fill="{{c.fur}}"></path>
<path d="M60 22 L54 32 L60 30 L66 34 Z" fill="{{c.furShade}}" stroke="none"></path>
<path d="M42 70 C42 60 50 56 60 56 C70 56 78 60 78 70 C78 84 70 96 60 100 C50 96 42 84 42 70 Z" fill="{{c.muzzle}}"></path>
</g>
<path d="M27 12 L31 16 L26 17" fill="none" stroke="{{c.line}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
<ellipse cx="60" cy="67" rx="8" ry="5.5" fill="{{c.line}}"></ellipse>
<ellipse cx="57" cy="65.5" rx="2.4" ry="1.4" fill="{{c.shine}}"></ellipse>

<sc-if value="{{smirk}}" hint-placeholder-val="{{true}}">
<path d="M33 50 Q42 42 51 50 Q42 55 33 50 Z" fill="{{c.eye}}" stroke="{{c.line}}" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="M69 50 Q78 42 87 50 Q78 55 69 50 Z" fill="{{c.eye}}" stroke="{{c.line}}" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="44" cy="49.5" r="3.4" fill="{{c.line}}"></circle>
<circle cx="80" cy="49.5" r="3.4" fill="{{c.line}}"></circle>
<path d="M32 47 L52 45.5" stroke="{{c.line}}" stroke-width="3" stroke-linecap="round"></path>
<path d="M68 45.5 L88 47" stroke="{{c.line}}" stroke-width="3" stroke-linecap="round"></path>
<path d="M31 39 L51 43" stroke="{{c.line}}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M69 43 L89 37" stroke="{{c.line}}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M50 80 Q58 86 71 77" fill="none" stroke="{{c.line}}" stroke-width="3" stroke-linecap="round"></path>
<path d="M65 81 L66.5 86 L68.5 80" fill="{{c.eye}}" stroke="{{c.line}}" stroke-width="1.5" stroke-linejoin="round"></path>
</sc-if>

<sc-if value="{{proud}}" hint-placeholder-val="{{false}}">
<path d="M34 51 Q42 43 50 51" fill="none" stroke="{{c.line}}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M70 51 Q78 43 86 51" fill="none" stroke="{{c.line}}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M32 38 L50 40" stroke="{{c.line}}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M70 40 L88 38" stroke="{{c.line}}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M47 77 Q60 96 73 77 Z" fill="{{c.line}}" stroke="{{c.line}}" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="M53 85 Q60 92 67 85 Q60 82 53 85 Z" fill="{{c.tongue}}"></path>
<path d="M50 77.5 L52 82 L54.5 77.5 Z" fill="{{c.eye}}"></path>
<path d="M65.5 77.5 L68 82 L70 77.5 Z" fill="{{c.eye}}"></path>
</sc-if>

<sc-if value="{{meh}}" hint-placeholder-val="{{false}}">
<circle cx="42" cy="50" r="7" fill="{{c.eye}}" stroke="{{c.line}}" stroke-width="2.5"></circle>
<circle cx="78" cy="50" r="7" fill="{{c.eye}}" stroke="{{c.line}}" stroke-width="2.5"></circle>
<circle cx="42" cy="52" r="3" fill="{{c.line}}"></circle>
<circle cx="78" cy="52" r="3" fill="{{c.line}}"></circle>
<path d="M32 36 L50 41" stroke="{{c.line}}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M70 42 L88 42" stroke="{{c.line}}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M51 83 Q55.5 79 60 83 Q64.5 87 69 83" fill="none" stroke="{{c.line}}" stroke-width="3" stroke-linecap="round"></path>
<path d="M86 30 Q90 36 86 40 Q82 36 86 30 Z" fill="{{c.drop}}" stroke="{{c.line}}" stroke-width="2" stroke-linejoin="round"></path>
</sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","default":"smirk","options":["smirk","proud","meh"]},"size":{"editor":"int","default":160},"theme":{"editor":"enum","default":"day","options":["day","night"]},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const PAL = {
      day: { line: '#1E2233', fur: '#8796B0', furShade: '#6B7A96', muzzle: '#F1E7D3', ear: '#E6A391', eye: '#FFF8E8', shine: '#8796B0', tongue: '#E07A6A', drop: '#9CCFDB' },
      night: { line: '#0B1020', fur: '#8E9DBC', furShade: '#6F7FA0', muzzle: '#E9DFC8', ear: '#E08F80', eye: '#FFF4DC', shine: '#8E9DBC', tongue: '#E07A6A', drop: '#9CCFDB' }
    };
    const mood = this.props.mood ?? 'smirk';
    const size = Number(this.props.size ?? 160);
    const labels = { smirk: 'Волк в деле', proud: 'Волк доволен', meh: 'Волк слил, но не сдаётся' };
    return {
      c: PAL[this.props.theme === 'night' ? 'night' : 'day'],
      size, px: size + 'px',
      smirk: mood === 'smirk', proud: mood === 'proud', meh: mood === 'meh',
      label: labels[mood] ?? labels.smirk
    };
  }
}
</script>
</body>
</html>
