<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Иконка приложения — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;family=Unbounded:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 1160px; box-sizing: border-box; padding: 48px 64px; background: #F3E9D2; color: #1E2233; font-family: Rubik, system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px;">
<div style="display: flex; align-items: baseline; gap: 18px;">
<h1 style="margin: 0; font-family: Unbounded, Rubik, sans-serif; font-size: 40px; font-weight: 800;">Иконка приложения</h1>
<span style="font-size: 16px; color: #5A5E6E;">три варианта · крупно, в малых размерах, в круглой маске Android и на домашнем экране</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px;">
<sc-for list="{{variants}}" as="v" hint-placeholder-count="3">
<section aria-label="{{v.name}}" style="display: flex; flex-direction: column; gap: 18px; padding: 24px; background: #FFF8E8; border: 2.5px solid #1E2233; border-radius: 24px; box-shadow: 5px 5px 0 #1E2233;">
<div style="display: flex; align-items: center; gap: 12px;">
<span style="transform: rotate(-3deg); padding: 4px 12px; background: #F5B82E; border: 2.5px solid #1E2233; border-radius: 10px; font-family: Unbounded, Rubik, sans-serif; font-size: 16px; font-weight: 800;">{{v.letter}}</span>
<span style="display: flex; flex-direction: column;"><span style="font-size: 18px; font-weight: 700;">{{v.name}}</span><span style="font-size: 13px; color: #5A5E6E;">{{v.hint}}</span></span>
</div>
<div style="align-self: center;">
<dc-import name="M-IconArt" variant="{{v.key}}" size="240" hint-size="240px,240px"></dc-import>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between;">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
<dc-import name="M-IconArt" variant="{{v.key}}" size="{{s}}" hint-size="{{s}}px,{{s}}px"></dc-import>
<span style="font-size: 12px; color: #5A5E6E;">{{s}}</span>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
<div style="width: 96px; height: 96px; border-radius: 50%; overflow: hidden;">
<dc-import name="M-IconArt" variant="{{v.key}}" size="96" rounded="{{false}}" hint-size="96px,96px"></dc-import>
</div>
<span style="font-size: 12px; color: #5A5E6E;">Android</span>
</div>
</div>
</section>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px;">
<sc-for list="{{walls}}" as="w" hint-placeholder-count="2">
<section aria-label="{{w.name}}" style="padding: 28px 24px; background: {{w.bg}}; border: 2.5px solid #1E2233; border-radius: 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 12px; justify-items: center;">
<sc-for list="{{w.cells}}" as="c" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px;">
<sc-if value="{{c.ours}}" hint-placeholder-val="{{false}}">
<dc-import name="M-IconArt" variant="{{c.key}}" size="64" hint-size="64px,64px"></dc-import>
</sc-if>
<sc-if value="{{c.blank}}" hint-placeholder-val="{{true}}">
<span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 14px; background: {{w.blank}};"></span>
</sc-if>
<span style="font-size: 11px; color: {{w.fg}}; white-space: nowrap;">{{c.label}}</span>
</div>
</sc-for>
</section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    const variants = [
      { key: 'moon', letter: 'А', name: 'Волк на луне', hint: 'вечернее небо, полная луна, звёзды' },
      { key: 'sticker', letter: 'Б', name: 'Волк на жёлтом', hint: 'крупно, читается даже совсем мелким' },
      { key: 'hill', letter: 'В', name: 'Волк на холме', hint: 'дневное небо, луна сбоку' }
    ];
    const cells = (labels) => {
      const order = ['moon', 'blank', 'blank', 'sticker', 'blank', 'hill', 'blank', 'blank'];
      return order.map((k, i) => ({
        ours: k !== 'blank', blank: k === 'blank', key: k,
        label: k === 'blank' ? '' : 'OpenStreak ' + labels[k]
      }));
    };
    const labels = { moon: 'А', sticker: 'Б', hill: 'В' };
    return {
      variants,
      sizes: [120, 76, 48],
      walls: [
        { name: 'Светлые обои', bg: '#DCE6EA', fg: '#1E2233', blank: '#BCC8CE', cells: cells(labels) },
        { name: 'Тёмные обои', bg: '#141A2B', fg: '#F6EBD3', blank: '#2C3550', cells: cells(labels) }
      ]
    };
  }
}
</script>
</body>
</html>
